```jsp
<%@page contentType="text/html" pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May tinh Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>
        <p>May tinh voi cac phep toan co ban</p>

        <form action="calculator" method="post">
            <label for="firstOperand">So thu nhat:</label>
            <input type="number" id="firstOperand"
                   name="firstOperand" step="any" required>

            <label for="operator">Phep tinh:</label>
            <select id="operator" name="operator" required>
                <option value="add">Cong (+)</option>
                <option value="subtract">Tru (-)</option>
                <option value="multiply">Nhan (*)</option>
                <option value="divide">Chia (/)</option>
            </select>

            <label for="secondOperand">So thu hai:</label>
            <input type="number" id="secondOperand"
                   name="secondOperand" step="any" required>

            <button type="submit">Tinh ket qua</button>
        </form>
    </div>
</body>
</html>
```
